<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Blueprint grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
    <!-- Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="drivewayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#0b1120"/>
  <rect width="1200" height="800" fill="url(#smallGrid)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- Outer Boundary Wall -->
  <rect x="40" y="40" width="1120" height="720" rx="12" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.8"/>
  <rect x="44" y="44" width="1112" height="712" rx="10" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Driveway Aisles -->
  <!-- Main Horizontal Driveway -->
  <rect x="180" y="340" width="840" height="120" fill="url(#drivewayGrad)" stroke="#334155" stroke-width="1"/>
  <!-- Lane divider markings -->
  <path d="M 200 400 L 1000 400" stroke="#fbbf24" stroke-width="3" stroke-dasharray="25,20" stroke-opacity="0.7"/>

  <!-- North Parking Aisle -->
  <rect x="180" y="80" width="840" height="230" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="1"/>
  <!-- South Parking Aisle -->
  <rect x="180" y="490" width="840" height="230" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="1"/>

  <!-- Bay Guide Markings (North Row - Top) -->
  <g stroke="#475569" stroke-width="2" stroke-opacity="0.5">
    <line x1="220" y1="80" x2="220" y2="180"/>
    <line x1="300" y1="80" x2="300" y2="180"/>
    <line x1="380" y1="80" x2="380" y2="180"/>
    <line x1="460" y1="80" x2="460" y2="180"/>
    <line x1="540" y1="80" x2="540" y2="180"/>
    <line x1="620" y1="80" x2="620" y2="180"/>
    <line x1="700" y1="80" x2="700" y2="180"/>
    <line x1="780" y1="80" x2="780" y2="180"/>
    <line x1="860" y1="80" x2="860" y2="180"/>
    <line x1="940" y1="80" x2="940" y2="180"/>
    <line x1="1020" y1="80" x2="1020" y2="180"/>
  </g>

  <!-- Bay Guide Markings (North Row - Lower) -->
  <g stroke="#475569" stroke-width="2" stroke-opacity="0.5">
    <line x1="220" y1="210" x2="220" y2="310"/>
    <line x1="300" y1="210" x2="300" y2="310"/>
    <line x1="380" y1="210" x2="380" y2="310"/>
    <line x1="460" y1="210" x2="460" y2="310"/>
    <line x1="540" y1="210" x2="540" y2="310"/>
    <line x1="620" y1="210" x2="620" y2="310"/>
    <line x1="700" y1="210" x2="700" y2="310"/>
    <line x1="780" y1="210" x2="780" y2="310"/>
    <line x1="860" y1="210" x2="860" y2="310"/>
    <line x1="940" y1="210" x2="940" y2="310"/>
    <line x1="1020" y1="210" x2="1020" y2="310"/>
  </g>

  <!-- Bay Guide Markings (South Row - Top) -->
  <g stroke="#475569" stroke-width="2" stroke-opacity="0.5">
    <line x1="220" y1="490" x2="220" y2="590"/>
    <line x1="300" y1="490" x2="300" y2="590"/>
    <line x1="380" y1="490" x2="380" y2="590"/>
    <line x1="460" y1="490" x2="460" y2="590"/>
    <line x1="540" y1="490" x2="540" y2="590"/>
    <line x1="620" y1="490" x2="620" y2="590"/>
    <line x1="700" y1="490" x2="700" y2="590"/>
    <line x1="780" y1="490" x2="780" y2="590"/>
    <line x1="860" y1="490" x2="860" y2="590"/>
    <line x1="940" y1="490" x2="940" y2="590"/>
    <line x1="1020" y1="490" x2="1020" y2="590"/>
  </g>

  <!-- Bay Guide Markings (South Row - Lower) -->
  <g stroke="#475569" stroke-width="2" stroke-opacity="0.5">
    <line x1="220" y1="620" x2="220" y2="720"/>
    <line x1="300" y1="620" x2="300" y2="720"/>
    <line x1="380" y1="620" x2="380" y2="720"/>
    <line x1="460" y1="620" x2="460" y2="720"/>
    <line x1="540" y1="620" x2="540" y2="720"/>
    <line x1="620" y1="620" x2="620" y2="720"/>
    <line x1="700" y1="620" x2="700" y2="720"/>
    <line x1="780" y1="620" x2="780" y2="720"/>
    <line x1="860" y1="620" x2="860" y2="720"/>
    <line x1="940" y1="620" x2="940" y2="720"/>
    <line x1="1020" y1="620" x2="1020" y2="720"/>
  </g>

  <!-- Structural Pillars -->
  <g fill="#475569" stroke="#64748b" stroke-width="1">
    <circle cx="300" cy="325" r="10"/>
    <circle cx="540" cy="325" r="10"/>
    <circle cx="780" cy="325" r="10"/>
    <circle cx="940" cy="325" r="10"/>
    
    <circle cx="300" cy="475" r="10"/>
    <circle cx="540" cy="475" r="10"/>
    <circle cx="780" cy="475" r="10"/>
    <circle cx="940" cy="475" r="10"/>
  </g>

  <!-- West Entry & Gate -->
  <rect x="40" y="350" width="140" height="100" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="2"/>
  <text x="110" y="395" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ENTRY GATE</text>
  <text x="110" y="415" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">BOOM BARRIER</text>
  <!-- Direction Arrow -->
  <path d="M 130 435 L 170 435 L 160 425 M 170 435 L 160 445" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- East Exit & Gate -->
  <rect x="1020" y="350" width="140" height="100" fill="#1e293b" fill-opacity="0.8" stroke="#f43f5e" stroke-width="2"/>
  <text x="1090" y="395" fill="#f43f5e" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">EXIT GATE</text>
  <text x="1090" y="415" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">AUTOMATED TOLL</text>
  <path d="M 1030 365 L 1070 365 L 1060 355 M 1070 365 L 1060 375" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pedestrian Walkways & Crosswalks -->
  <g stroke="#ffffff" stroke-width="4" stroke-opacity="0.6">
    <line x1="180" y1="350" x2="180" y2="450" stroke-dasharray="10,8"/>
    <line x1="1020" y1="350" x2="1020" y2="450" stroke-dasharray="10,8"/>
  </g>

  <!-- Elevators & Stairs Lobby (North-West) -->
  <rect x="55" y="60" width="110" height="120" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="110" y="110" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ELEVATORS</text>
  <text x="110" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">&amp; STAIRWELL</text>

  <!-- EV Charging Hub Notice (Zone A) -->
  <rect x="55" y="620" width="110" height="100" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="110" y="660" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⚡ EV FAST</text>
  <text x="110" y="680" fill="#a7f3d0" font-family="sans-serif" font-size="11" text-anchor="middle">CHARGING HUB</text>

  <!-- Architectural Title Block -->
  <rect x="780" y="730" width="380" height="30" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="795" y="750" fill="#94a3b8" font-family="monospace" font-size="11">PARKVISION ARCHITECTURE — LEVEL 0 (GROUND FLOOR) — SCALE 1:100</text>
</svg>
